<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechGear - Checkout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding-top: 60px;
        }
        .checkout {
            background-color: white;
            max-width: 480px;
            margin: auto;
            padding: 35px;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }
        .checkout h1 { margin-top: 0; }
        .resumen {
            background-color: #f4f4f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .resumen p { margin: 5px 0; }
        .precio { color: #27ae60; font-weight: bold; }
        label {
            display: block;
            text-align: left;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }
        .confirmar-btn {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .confirmar-btn:hover { background-color: #1d4ed8; }
        .volver { display: inline-block; margin-top: 15px; color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="checkout">
        <h1>🛒 Confirmar compra</h1>

        <div class="resumen">
            <p><strong>Producto:</strong> {{ nombre }}</p>
            <p class="precio">${{ precio }}</p>
            <p><strong>Stock disponible:</strong> {{ stock }}</p>
        </div>

        <form method="POST" action="{% url 'comprar_producto' %}">
            {% csrf_token %}

            <input type="hidden" name="producto_id" value="{{ producto_id }}">

            <label for="usuario">Nombre del cliente</label>
            <input type="text" id="usuario" name="usuario" required placeholder="Ej. Juan Pérez">

            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" name="cantidad" value="1" min="1" max="{{ stock }}" required>

            <button type="submit" class="confirmar-btn">
                Confirmar pedido
            </button>
        </form>

        <a href="{% url 'listar_productos' %}" class="volver">← Volver al catálogo</a>
    </div>
</body>
</html>
